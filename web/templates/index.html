<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.title}}</title>
    <script src="https://unpkg.com/htmx.org@1.9.6"></script>
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
    <div class="container">
        <header class="cabin-header">
            <h1 class="cabin-title">🏔️ Hyttekos</h1>
        </header>

        <main class="main-content">
            <div id="dashboard" hx-get="/htmx/dashboard" hx-trigger="load" hx-swap="innerHTML">
                <div class="loading">
                    <div class="loading-spinner"></div>
                    <p>Laster hyttestatus...</p>
                </div>
            </div>

            <div class="status-bar">
                <div class="connection-status">
                    <span class="status-indicator online"></span>
                    <span>Tilkoblet Akiles</span>
                </div>
                <div class="sensor-status">
                    <span class="status-indicator online"></span>
                    <span>Temperatursensor tilkoblet</span>
                </div>
                <div class="last-sync">
                    <span id="last-sync-time">Sist oppdatert: Nå nettopp</span>
                </div>
            </div>
        </main>

        <footer class="cabin-footer">
            <p>© 2023 Hyttekos - Fjernstyrning av hytta</p>
            <button class="logout-btn" hx-post="/auth/logout" hx-confirm="Er du sikker på at du vil logge ut?">
                Logg ut
            </button>
        </footer>
    </div>

    <script>
        // Auto-refresh temperature every 30 seconds
        setInterval(function() {
            htmx.ajax('GET', '/htmx/temperature', {target: '.temperature-card'});
            const now = new Date();
            document.getElementById('last-sync-time').textContent = 
                'Sist oppdatert: ' + now.toLocaleString('nb-NO', {hour12: false});
        }, 30000);
        
        // Set initial timestamp
        document.addEventListener('DOMContentLoaded', function() {
            const now = new Date();
            const syncEl = document.getElementById('last-sync-time');
            if (syncEl) {
                syncEl.textContent = 'Sist oppdatert: ' + now.toLocaleString('nb-NO', {hour12: false});
            }
        });
    </script>
</body>
</html>
