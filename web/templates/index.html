<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.title}}</title>
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
    <div class="container">
        <header class="cabin-header">
            <h1 class="cabin-title">🏔️ Hyttekos</h1>
        </header>

        <main class="main-content">
            <!-- Temperature Display -->
            <div class="temperature-card">
                <div class="temperature-card">
                    <div class="card-header">
                        <div class="thermometer-icon">
                            <div class="thermometer-bulb"></div>
                            <div class="thermometer-tube"></div>
                            <div class="degree-symbol">°</div>
                        </div>
                        <div class="temperature-info">
                            <div class="temperature-reading">
                                {{if .temperature}}
                                    {{printf "%.1f" .temperature.Temperature}}°C
                                {{else}}
                                    --°C
                                {{end}}
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Control Cards -->
            <div class="control-cards">
                <!-- Heating Card -->
                <div class="heating-card">
                    <div class="control-card heating-control">
                        <div class="card-header">
                            <div class="fire-icon">
                                <div class="flame flame1"></div>
                                <div class="flame flame2"></div>
                                <div class="flame flame3"></div>
                            </div>
                            <div class="control-info">
                                <h3>Gulvvarme</h3>
                            </div>
                        </div>
                        
                        <div class="card-body">
                            <span class="toggle-label">{{if .heating.Enabled}}På{{else}}Av{{end}}</span>
                            <form method="POST" action="/toggle/heating" style="display: inline;">
                                <button type="submit" class="toggle-switch {{if .heating.Enabled}}enabled{{else}}disabled{{end}}">
                                    <span class="sr-only">Toggle heating</span>
                                </button>
                            </form>
                        </div>
                    </div>
                </div>

                <!-- Hot Water Card -->
                <div class="hot-water-card">
                    <div class="control-card hot-water-control">
                        <div class="card-header">
                            <div class="water-icon">
                                <div class="water-drop">
                                    <div class="water-shine"></div>
                                </div>
                            </div>
                            <div class="control-info">
                                <h3>Varmtvann</h3>
                            </div>
                        </div>
                        
                        <div class="card-body">
                            <span class="toggle-label">{{if .hotWater.Enabled}}På{{else}}Av{{end}}</span>
                            <form method="POST" action="/toggle/hot-water" style="display: inline;">
                                <button type="submit" class="toggle-switch {{if .hotWater.Enabled}}enabled{{else}}disabled{{end}}">
                                    <span class="sr-only">Toggle hot water</span>
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>

            <div class="status-bar">
                <div class="connection-status">
                    <span class="status-indicator online"></span>
                    <span>Tilkoblet</span>
                </div>
                <div class="last-sync">
                    <span>Sist oppdatert: {{.lastUpdated}}</span>
                </div>
            </div>
        </main>

        <footer class="cabin-footer">
            <p>© 2025 Hyttekos - Fjernstyring av hytta</p>
            <form method="POST" action="/auth/logout" style="display: inline;">
                <button type="submit" class="logout-btn" onclick="return confirm('Er du sikker på at du vil logge ut?')">
                    Logg ut
                </button>
            </form>
        </footer>
    </div>
</body>
</html>
