<div class="heating-card" id="heating-card">
    <div class="control-card heating-control">
        <div class="card-header">
            <div class="fire-icon">
                <div class="flame flame1"></div>
                <div class="flame flame2"></div>
                <div class="flame flame3"></div>
            </div>
            <div class="control-info">
                <h3>Gulvvarme</h3>
            </div>
        </div>
        
        <div class="card-body">
            <span class="toggle-label">{{if .heating.Enabled}}På{{else}}Av{{end}}</span>
            <button class="toggle-switch {{if .heating.Enabled}}enabled{{else}}disabled{{end}}" 
                    hx-post="/htmx/heating/toggle" 
                    hx-target="#heating-card"
                    hx-swap="outerHTML"
                    hx-indicator="#heating-loading">
                <div id="heating-loading" class="htmx-indicator">
                    <div class="loading-spinner"></div>
                </div>
            </button>
        </div>
    </div>
</div>
